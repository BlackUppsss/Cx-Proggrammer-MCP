[project]
name = "cx-programmer-mcp"
version = "0.4.0"
description = "Program-focused MCP server for offline Omron CX-Programmer CXP/CXT ladder analysis and editing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
cx-programmer-mcp = "cx_programmer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cx_programmer_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/cx_programmer_mcp/templates" = "cx_programmer_mcp/templates"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
